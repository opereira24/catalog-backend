spring:
  application:
    name: catalog-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_placeholder}
    username: ${DB_USERNAME:placeholder}
    password: ${DB_PASSWORD:placeholder}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Teto de pagina de todas as listagens com Pageable do back-office (TASK-003, AC D.2): ?size=1000
  # devolve 100. Global e seguro para o publico: o PublicCarController nao recebe Pageable (o teto
  # dele e o CarQueryService#MAX_PAGE_SIZE = 60).
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8081}

# Origem(ns) permitida(s) a chamar /api/** (o site publico dc) — TASK-014 requisito 6, e
# submissao publica de leads (POST /api/leads) — TASK-015
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Resource server JWT do Auth0 (TASK-002), lido por config/SecurityConfig e Auth0RolesConverter.
  # Nunca em spring.security.oauth2.resourceserver: o JwtDecoder e declarado no SecurityConfig.
  # issuer-uri e audience ficam VAZIOS por omissao, de proposito: sem os dois, o decoder recusa
  # todos os tokens (401, zero rede, WARN no arranque). Nunca um placeholder como
  # https://placeholder.auth0.com/: um tenant Auth0 e de quem o registar primeiro, e esse terceiro
  # passava a emitir tokens que este servico aceitava. roles-claim tem o default de producao (nome
  # fixo pela Action do tenant, nao e segredo; so e lido de tokens ja validados).
  auth0:
    issuer-uri: ${AUTH0_ISSUER_URI:}
    audience: ${AUTH0_AUDIENCE:}
    roles-claim: ${AUTH0_ROLES_CLAIM:https://oteustand.pt/roles}
  leads:
    rate-limit:
      max-requests: ${LEADS_RATE_LIMIT_MAX_REQUESTS:5}
      window-minutes: ${LEADS_RATE_LIMIT_WINDOW_MINUTES:10}
      trusted-proxy-hops: ${LEADS_RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
      cleanup-interval-ms: ${LEADS_RATE_LIMIT_CLEANUP_INTERVAL_MS:300000}
    forward:
      max-attempts: ${LEADS_FORWARD_MAX_ATTEMPTS:5}
      retry:
        enabled: ${LEADS_FORWARD_RETRY_ENABLED:true}
        interval-ms: ${LEADS_FORWARD_RETRY_INTERVAL_MS:300000}

# Token partilhado que o dcbo-backend usa para autenticar chamadas de propagação, e que este
# servico reutiliza (TASK-015 requisito 5) para autenticar o encaminhamento de leads na direcao
# inversa (POST /internal/leads do dcbo-backend) — e o mesmo segredo nos dois sentidos.
internal:
  sync:
    token: ${CATALOG_SYNC_TOKEN:placeholder}

# Base URL do dcbo-backend, usada pelo encaminhamento de leads (TASK-015 requisito 5)
dcbo:
  sync:
    base-url: ${DCBO_SYNC_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
